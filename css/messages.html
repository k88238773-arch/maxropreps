<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Messages | MAXROPREPS</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .chat-wrapper {
            display: grid;
            grid-template-columns: 240px 1fr;
            height: 500px;
            gap: 15px;
        }
        .chat-sidebar {
            background: #0e1322;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow-y: auto;
            padding: 10px;
        }
        .active-user-item {
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
            background: #131a2e;
        }
        .active-user-item:hover, .active-user-item.selected {
            background: var(--brand-blue);
            color: white;
        }
        .chat-window {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-messages-container {
            flex: 1;
            background: #131a2e;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }
        .msg-bubble {
            margin-bottom: 10px;
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        .msg-sent {
            background: var(--brand-purple);
            color: white;
            margin-left: auto;
        }
        .msg-received {
            background: #1e293b;
            color: white;
        }
    </style>
</head>
<body>

    <nav id="global-navbar"></nav>

    <div class="container" style="max-width: 950px;">
        <div class="chat-wrapper">
            
            <div class="chat-sidebar">
                <h3 style="font-size: 12px; margin: 5px 0 15px 5px; color: var(--text-muted); text-transform: uppercase;">Recruits List</h3>
                <div id="chat-users-list"></div>
            </div>

            <div class="chat-window card">
                <div id="chat-header-title" style="font-weight: bold; font-size: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 12px;">
                    Select a recruit to message...
                </div>
                
                <div class="chat-messages-container" id="chat-stream-box"></div>
                
                <form id="chat-sender-form" onsubmit="sendLiveMessage(event)" style="display: flex; gap: 10px;">
                    <input type="text" id="chat-input-field" placeholder="Type an offer or DM message..." required disabled>
                    <button type="submit" class="join-btn" id="chat-send-btn" style="border: none; cursor: pointer;" disabled>Send</button>
                </form>
            </div>

        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let currentTargetUser = null;

        function setupMessagingWorkspace() {
            const me = getSessionUser();
            if (!me) {
                document.getElementById("chat-stream-box").innerHTML = `
                    <div style="text-align:center; padding-top:40px; color:var(--text-muted);">
                        Please <a href="login.html" style="color:var(--brand-blue)">Sign In</a> to open your DM chat engine inbox.
                    </div>`;
                return;
            }

            const players = getPlayersFromStorage();
            const listContainer = document.getElementById("chat-users-list");
            const targets = players.filter(p => p.username.toLowerCase() !== me.toLowerCase());

            if (targets.length === 0) {
                listContainer.innerHTML = `<div style="font-size:12px; color:var(--text-muted); padding:5px;">No players found.</div>`;
                return;
            }

            listContainer.innerHTML = targets.map(t => `
                <div class="active-user-item" id="sidebar-user-${t.username}" onclick="selectChatTarget('${t.username}')">
                    👤 ${t.username}
                </div>
            `).join('');

            const urlParams = new URLSearchParams(window.location.search);
            const shortcut = urlParams.get("chatTarget");
            if (shortcut) selectChatTarget(shortcut);
        }

        function selectChatTarget(username) {
            currentTargetUser = username;
            document.querySelectorAll(".active-user-item").forEach(el => el.classList.remove("selected"));
            const targetEl = document.getElementById(`sidebar-user-${username}`);
            if (targetEl) targetEl.classList.add("selected");

            document.getElementById("chat-header-title").innerText = `💬 Conversation with ${username}`;
            document.getElementById("chat-input-field").disabled = false;
            document.getElementById("chat-send-btn").disabled = false;

            renderActiveStream();
        }

        function renderActiveStream() {
            const me = getSessionUser();
            if (!currentTargetUser || !me) return;

            const masterMessages = JSON.parse(localStorage.getItem("mr_messages_db")) || {};
            const channelKey = [me.toLowerCase(), currentTargetUser.toLowerCase()].sort().join("_and_");
            const thread = masterMessages[channelKey] || [];

            const streamBox = document.getElementById("chat-stream-box");
            if (thread.length === 0) {
                streamBox.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:30px;">Conversation empty. Send a message to start things off!</p>`;
                return;
            }

            streamBox.innerHTML = thread.map(m => `
                <div class="msg-bubble ${m.sender.toLowerCase() === me.toLowerCase() ? 'msg-sent' : 'msg-received'}">
                    ${m.text}
                </div>
            `).join('');
            
            streamBox.scrollTop = streamBox.scrollHeight;
        }

        function sendLiveMessage(e) {
            e.preventDefault();
            const me = getSessionUser();
            const input = document.getElementById("chat-input-field");
            if (!currentTargetUser || !me || !input.value.trim()) return;

            const masterMessages = JSON.parse(localStorage.getItem("mr_messages_db")) || {};
            const channelKey = [me.toLowerCase(), currentTargetUser.toLowerCase()].sort().join("_and_");
            if (!masterMessages[channelKey]) masterMessages[channelKey] = [];

            masterMessages[channelKey].push({
                sender: me,
                text: input.value.trim()
            });

            localStorage.setItem("mr_messages_db", JSON.stringify(masterMessages));
            input.value = "";
            renderActiveStream();
        }

        const originalLoad = window.onload;
        window.onload = function() {
            if (originalLoad) originalLoad();
            setupMessagingWorkspace();
        };
    </script>
</body>
</html>
